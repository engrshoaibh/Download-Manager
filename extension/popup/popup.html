<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Download Manager Pro</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="../icons/icon48.png" width="36" height="36" alt="" />
    <div class="title">
      <h1>Download Manager Pro</h1>
      <p id="daemon" class="daemon"><span class="dot"></span><span id="daemonText">Checking app…</span></p>
    </div>
    <label class="master" title="Capture downloads">
      <input type="checkbox" id="enabled" class="switch" />
    </label>
  </header>

  <main>
    <section class="card">
      <h2>Capture</h2>
      <label class="field">
        <span>Mode</span>
        <select id="captureMode">
          <option value="ask">Ask first (dialog)</option>
          <option value="auto">Send automatically</option>
          <option value="off">Off — browser only</option>
        </select>
      </label>
      <label class="row">
        <span>Intercept browser downloads</span>
        <input type="checkbox" id="interceptBrowserDownloads" class="switch" />
      </label>
      <label class="row">
        <span>Open dialog on link click</span>
        <input type="checkbox" id="linkClickCapture" class="switch" />
      </label>
      <label class="row" title="Hold Alt while clicking a link to download it with the browser instead">
        <span>Alt+click uses the browser</span>
        <input type="checkbox" id="altSkipsCapture" class="switch" />
      </label>
      <label class="row" title="Hold Insert while clicking a link to capture it even if its type isn't in the list">
        <span>Insert+click forces capture</span>
        <input type="checkbox" id="insertForcesCapture" class="switch" />
      </label>
    </section>

    <section class="card">
      <h2>Video</h2>
      <label class="row">
        <span>Catch video page links</span>
        <input type="checkbox" id="catchVideoPageLinks" class="switch" />
      </label>
      <label class="row">
        <span>Download banner on videos</span>
        <input type="checkbox" id="videoBanner" class="switch" />
      </label>
      <label class="row">
        <span>Media grabber panel</span>
        <input type="checkbox" id="mediaGrabber" class="switch" />
      </label>
    </section>

    <section class="card">
      <h2>Downloads</h2>
      <label class="field">
        <span>Connections per download</span>
        <input type="number" id="segments" min="1" max="64" />
      </label>
      <label class="field">
        <span>File types to capture</span>
        <textarea id="extensions" rows="3" spellcheck="false"></textarea>
      </label>
    </section>
  </main>

  <footer>
    <span id="saved" class="saved" hidden>Saved</span>
    <button type="button" id="save" class="primary">Save changes</button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
