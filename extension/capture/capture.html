<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Download File</title>
  <link rel="stylesheet" href="capture.css" />
</head>
<body>
  <header class="bar">
    <img src="../icons/icon48.png" alt="" width="36" height="36" />
    <div>
      <h1>Download file</h1>
      <p class="sub">Send to Download Manager Pro</p>
    </div>
  </header>

  <main>
    <label class="field">
      <span>Address</span>
      <input id="url" type="text" readonly />
    </label>

    <label class="field">
      <span>File name</span>
      <input id="filename" type="text" readonly />
    </label>

    <div class="row">
      <label class="field narrow">
        <span>Connections</span>
        <input id="segments" type="number" min="1" max="64" value="16" />
      </label>
      <label class="field grow">
        <span>Save to</span>
        <div class="with-button">
          <input id="saveDir" type="text" placeholder="Default Downloads folder" />
          <button type="button" id="btnBrowse" class="icon-btn" title="Choose folder" aria-label="Choose folder">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2.5h8.5A1.5 1.5 0 0 1 21 10v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18z" />
            </svg>
          </button>
        </div>
      </label>
    </div>

    <p id="status" class="status" hidden></p>
  </main>

  <footer>
    <button type="button" id="btnBrowser" class="btn ghost">Use browser instead</button>
    <div class="spacer"></div>
    <button type="button" id="btnCancel" class="btn">Cancel</button>
    <button type="button" id="btnStart" class="btn primary">Start download</button>
  </footer>

  <script type="module" src="capture.js"></script>
</body>
</html>
