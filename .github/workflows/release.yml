name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build and Release
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      # The tag must match the crate version: the in-app updater compares them.
      - name: Verify tag matches crate version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $crate = (Select-String -Path core/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($crate -ne $tag) { throw "Tag v$tag does not match core/Cargo.toml version $crate" }

      - name: Run tests
        working-directory: core
        run: cargo test --locked

      # Inno Setup 6 is preinstalled on windows-latest; install it only if missing.
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: .\build_release.ps1

      # Branch / manual runs: keep the assets as a run artifact (no release is created).
      - name: Upload assets (non-tag runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: release/*
          if-no-files-found: error

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
