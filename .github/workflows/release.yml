name: Release

# Releases are automatic: a push to main whose core/Cargo.toml version has no tag yet
# builds the installer, creates the vX.Y.Z tag and publishes the GitHub Release.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and Release
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      # The tag must match the crate version: the in-app updater compares them.
      # On main / manual runs, release only when this version has not been released yet.
      - name: Decide release
        id: rel
        shell: pwsh
        run: |
          $crate = (Select-String -Path core/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $tag = "v$crate"
          if ("${{ github.ref }}".StartsWith('refs/tags/')) {
            if ("${{ github.ref_name }}" -ne $tag) { throw "Tag ${{ github.ref_name }} does not match core/Cargo.toml version $crate" }
            $release = 'true'
          } else {
            $existing = git ls-remote --tags origin "refs/tags/$tag"
            $release = if ($existing) { 'false' } else { 'true' }
            if ($existing) { Write-Host "$tag already released - building without publishing" }
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT

      - name: Run tests
        working-directory: core
        run: cargo test --locked

      # Inno Setup 6 is preinstalled on windows-latest; install it only if missing.
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: .\build_release.ps1

      # Branch / manual runs: keep the assets as a run artifact (no release is created).
      - name: Upload assets (no release)
        if: steps.rel.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: release/*
          if-no-files-found: error

      # Creates the tag on this commit when it doesn't exist yet.
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: steps.rel.outputs.release == 'true'
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
